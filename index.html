<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เกมปล่อยกรงหมา</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&display=swap');
*{box-sizing:border-box}
body{font-family:Prompt,sans-serif;text-align:center;background:#eaf5ff;color:#26364a;margin:0;padding:20px}
h1{color:#245c91}
.stats{display:flex;justify-content:center;gap:15px;flex-wrap:wrap;margin:20px}
.stat{background:white;padding:12px 24px;border-radius:15px}
.stat strong{display:block;font-size:25px;color:#2879bd}
.grid{max-width:800px;margin:auto;display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.cage{background:white;border:2px solid #b9cee0;border-radius:16px;padding:18px;cursor:pointer;font:inherit}
.animal{font-size:48px;display:block}
.cage.released{background:#e0f8e7;border-color:#79c794}
.cage.released .animal{animation:run 1s forwards}
@keyframes run{to{transform:translateX(150px);opacity:0}}
.overlay{display:none;position:fixed;inset:0;background:#0009;align-items:center;justify-content:center;padding:20px}
.overlay.show{display:flex}
.popup{background:white;border-radius:20px;padding:25px;width:min(350px,100%)}
.popup .big{font-size:55px}
button.primary{background:#2879bd;color:white;border:0;padding:12px 25px;border-radius:30px;font:inherit;cursor:pointer}
#ending{display:none;position:fixed;inset:0;background:#101827;color:white;overflow:auto;padding:25px}
#ending.show{display:flex;align-items:center;justify-content:center}
#ending video{width:100%;max-width:800px;max-height:65vh}
@media(min-width:650px){.grid{grid-template-columns:repeat(5,1fr)}}
</style>
</head>
<body>
<h1>🐶 เกมปล่อยกรงหมา 🐱</h1>
<div class="stats">
<div class="stat">คะแนน<strong id="score">0</strong></div>
<div class="stat">ปล่อยแล้ว<strong><span id="count">0</span>/10</strong></div>
</div>
<div class="grid" id="cages"></div>
<p>แตะกรงเพื่อปลดล็อกและปล่อยสัตว์!</p>
<div class="overlay" id="popup">
<div class="popup">
<div class="big" id="popAnimal">🐶</div>
<h2 id="popTitle">ปล่อยสำเร็จ!</h2>
<p id="popText"></p>
<button class="primary" id="next">ไปต่อ</button>
</div>
</div>
<div id="ending">
<div>
<h1 style="color:white">🎉 ปล่อยครบ 10 ตัวแล้ว!</h1>
<p id="finalScore"></p>
<video id="endVideo" controls playsinline>
<source src="ending-video.mp4" type="video/mp4">
</video>
<br><button class="primary" id="again">เล่นอีกครั้ง</button>
</div>
</div>
<script>
const animals=['🐶','🐱','🐶','🐱','🐶','🐱','🐶','🐱','🐶','🐱'];
let score=0,count=0;
const cages=document.getElementById('cages');
function draw(){
cages.innerHTML='';
animals.forEach((animal,i)=>{
const b=document.createElement('button');
b.className='cage';
b.innerHTML='<span class="animal">'+animal+'</span>กรงที่ '+(i+1)+'<br>🔒 ล็อกอยู่';
b.onclick=()=>{
if(b.classList.contains('released'))return;
b.classList.add('released');b.disabled=true;
b.innerHTML='<span class="animal">'+animal+'</span>กรงที่ '+(i+1)+'<br>🔓 ปล่อยแล้ว!';
score+=10;count++;
document.getElementById('score').textContent=score;
document.getElementById('count').textContent=count;
document.getElementById('popAnimal').textContent=animal;
document.getElementById('popTitle').textContent=animal==='🐶'?'ปล่อยน้องหมาสำเร็จ!':'ปล่อยน้องแมวสำเร็จ!';
document.getElementById('popText').textContent='ได้ 10 คะแนน • ปล่อยแล้ว '+count+'/10 ตัว';
document.getElementById('popup').classList.add('show');
};
cages.appendChild(b);
});
}
document.getElementById('next').onclick=()=>{
document.getElementById('popup').classList.remove('show');
if(count===10){
document.getElementById('finalScore').textContent='คะแนนรวม '+score+' คะแนน';
document.getElementById('ending').classList.add('show');
document.getElementById('endVideo').play().catch(()=>{});
}
};
function reset(){
score=0;count=0;
document.getElementById('score').textContent=0;
document.getElementById('count').textContent=0;
document.getElementById('popup').classList.remove('show');
document.getElementById('ending').classList.remove('show');
const v=document.getElementById('endVideo');v.pause();v.currentTime=0;
draw();
}
document.getElementById('again').onclick=reset;
draw();
</script>
</body>
  </html>
